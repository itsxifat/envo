; Envo - PJSIP globals and transports. Endpoints are generated into envo/pjsip_envo.conf.
[global]
type = global
user_agent = Envo PBX
endpoint_identifier_order = ip,username,anonymous,header,auth_username
default_realm = __SIP_DOMAIN__
keep_alive_interval = 90
unidentified_request_count = 5
unidentified_request_period = 5
unidentified_request_prune_interval = 30
ignore_uri_user_options = yes
norefersub = yes
send_contact_status_on_update_registration = yes
taskprocessor_overload_trigger = pjsip_only

[system]
type = system
timer_t1 = 500
timer_b = 32000
disable_tcp_switch = yes

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
external_media_address = __PUBLIC_IP__
external_signaling_address = __PUBLIC_IP__
local_net = 127.0.0.0/8
local_net = 10.0.0.0/8
local_net = 172.16.0.0/12
local_net = 192.168.0.0/16
local_net = 100.64.0.0/10
tos = cs3

[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:5060
external_media_address = __PUBLIC_IP__
external_signaling_address = __PUBLIC_IP__
local_net = 127.0.0.0/8
local_net = 10.0.0.0/8
local_net = 172.16.0.0/12
local_net = 192.168.0.0/16
local_net = 100.64.0.0/10
tos = cs3

[transport-tls]
type = transport
protocol = tls
bind = 0.0.0.0:5061
cert_file = /etc/asterisk/keys/envo.crt
priv_key_file = /etc/asterisk/keys/envo.key
method = tlsv1_2
external_media_address = __PUBLIC_IP__
external_signaling_address = __PUBLIC_IP__
local_net = 127.0.0.0/8
local_net = 10.0.0.0/8
local_net = 172.16.0.0/12
local_net = 192.168.0.0/16
local_net = 100.64.0.0/10
tos = cs3

; SIP over WebSocket for the browser phone (TLS terminates at nginx: wss://<host>/ws)
[transport-ws]
type = transport
protocol = ws
bind = 0.0.0.0

#include envo/pjsip_envo.conf
