; Envo - media ports (10000-20000/udp must be open in the firewall)
[general]
rtpstart = 10000
rtpend = 20000
strictrtp = yes
icesupport = yes
; Offer only the public address as an ICE host candidate (hide docker / tailscale / private interfaces)
ice_deny = 10.0.0.0/8
ice_deny = 172.16.0.0/12
ice_deny = 192.168.0.0/16
ice_deny = 100.64.0.0/10
ice_deny = 127.0.0.0/8
