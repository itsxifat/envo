; Envo - voicemail. Mailboxes are generated into envo/voicemail_envo.conf.
[general]
format = wav
serveremail = envo
attach = yes
skipms = 3000
maxsilence = 10
silencethreshold = 128
maxlogins = 3
maxmsg = 100
maxsecs = 180
sendvoicemail = yes
review = no
operator = no
envelope = yes
moveheard = yes
pollmailboxes = yes
pollfreq = 30

[zonemessages]
dhaka = Asia/Dhaka|'vm-received' Q 'digits/at' IMp

#include envo/voicemail_envo.conf
