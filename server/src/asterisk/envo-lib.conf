; Envo dialplan library - generated by Envo. DO NOT EDIT, changes are overwritten.

[envo-ds]
; Builds a Dial() string that rings every registered contact of the given endpoints.
; Gosub(envo-ds,s,1(endpoint[,endpoint...])) -> ENVO_DS
exten => s,1,Set(ENVO_DS=)
 same => n,Set(LOCAL(i)=1)
 same => n(loop),GotoIf($[${i} > ${ARGC}]?done)
 same => n,GotoIf($[${LEN(${ARG${i}})} = 0]?next)
 same => n,Set(LOCAL(c)=${PJSIP_DIAL_CONTACTS(${ARG${i}})})
 same => n,GotoIf($[${LEN(${c})} = 0]?next)
 same => n,Set(ENVO_DS=${ENVO_DS}${IF($[${LEN(${ENVO_DS})} > 0]?&)}${c})
 same => n(next),Set(i=$[${i} + 1])
 same => n,Goto(loop)
 same => n(done),Return()

[envo-dial-ext]
; Rings an extension: DND, call forwarding, voicemail and recording.
; Gosub(envo-dial-ext,s,1(tenant,extension,timeout,voicemail,record,endpoint[,webEndpoint]))
exten => s,1,NoOp(Envo: calling extension ${ARG2} of tenant ${ARG1})
 same => n,ExecIf($["${CDR(direction)}" = ""]?Set(CDR(direction)=internal))
 same => n,Set(LOCAL(FAM)=envo/t${ARG1}/${ARG2})
 same => n,GotoIf($["${DB(${FAM}/dnd)}" = "1"]?dnd)
 same => n,Set(LOCAL(FWD)=${DB(${FAM}/cfu)})
 same => n,GotoIf($[${LEN(${FWD})} > 0]?forward)
 same => n,Gosub(envo-ds,s,1(${ARG6},${ARG7}))
 same => n,GotoIf($[${LEN(${ENVO_DS})} = 0]?unavail)
 same => n,GosubIf($["${ARG5}" = "1" | "${ENVO_RECOUT}" = "1" | "${ENVO_REC}" = "1"]?envo-record,s,1)
 same => n,Dial(${ENVO_DS},${ARG3},tT)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy)
 same => n,GotoIf($["${DIALSTATUS}" = "NOANSWER" | "${DIALSTATUS}" = "CHANUNAVAIL" | "${DIALSTATUS}" = "CONGESTION"]?unavail)
 same => n,Return()
 same => n(unavail),Set(FWD=${DB(${FAM}/cfna)})
 same => n,GotoIf($[${LEN(${FWD})} > 0]?forward)
 same => n,GotoIf($["${ARG4}" = "1"]?vmu)
 same => n,Return()
 same => n(busy),Set(FWD=${DB(${FAM}/cfb)})
 same => n,GotoIf($[${LEN(${FWD})} > 0]?forward)
 same => n(dnd),GotoIf($["${ARG4}" = "1"]?vmb)
 same => n,Busy(5)
 same => n,Return()
 same => n(vmu),VoiceMail(${ARG2}@t${ARG1},u)
 same => n,Return()
 same => n(vmb),VoiceMail(${ARG2}@t${ARG1},b)
 same => n,Return()
 same => n(forward),Set(__ENVO_FWD_HOPS=$[0${ENVO_FWD_HOPS} + 1])
 same => n,GotoIf($[${ENVO_FWD_HOPS} > 3]?loop)
 same => n,NoOp(Envo: forwarding ${ARG2} to ${FWD})
 same => n,Goto(t${ARG1}-internal,${FWD},1)
 same => n(loop),NoOp(Envo: forwarding loop detected)
 same => n,Return()

[envo-record]
; Starts recording the call once. MixMonitor only writes while the channel is bridged.
exten => s,1,GotoIf($[${LEN(${ENVO_RECFILE})} > 0]?done)
 same => n,Set(LOCAL(T)=${IF($[${LEN(${ENVO_TENANT})} > 0]?${ENVO_TENANT}:0)})
 same => n,Set(__ENVO_RECFILE=t${T}/${STRFTIME(${EPOCH},,%Y/%m/%d)}/${UNIQUEID}.wav)
 same => n,Set(CDR(recordingfile)=${ENVO_RECFILE})
 same => n,MixMonitor(${ASTSPOOLDIR}/monitor/envo/${ENVO_RECFILE},b)
 same => n(done),Return()

[envo-limit]
; Joins a channel-limit group. Gosub(envo-limit,s,1(category,group,max)) -> ENVO_LIMIT_OK (1/0). max 0 = unlimited.
exten => s,1,Set(GROUP(${ARG1})=${ARG2})
 same => n,Set(ENVO_LIMIT_OK=1)
 same => n,GotoIf($[0${ARG3} = 0]?done)
 same => n,GotoIf($[${GROUP_COUNT(${ARG2}@${ARG1})} <= ${ARG3}]?done)
 same => n,NoOp(Envo: channel limit reached for ${ARG1} ${ARG2} max ${ARG3})
 same => n,Set(GROUP(${ARG1})=)
 same => n,Set(ENVO_LIMIT_OK=0)
 same => n(done),Return()

[envo-dial-trunk]
; Gosub(envo-dial-trunk,s,1(endpoint,number,trunkId,maxChannels)) -> ENVO_DIALSTATUS
exten => s,1,Gosub(envo-limit,s,1(envo_trunk,trunk${ARG3},${ARG4}))
 same => n,GotoIf($[${ENVO_LIMIT_OK} = 0]?full)
 same => n,Dial(PJSIP/${ARG2}@${ARG1},120,T)
 same => n,Set(ENVO_DIALSTATUS=${DIALSTATUS})
 same => n,Return()
 same => n(full),Set(ENVO_DIALSTATUS=CHANUNAVAIL)
 same => n,Return()

[envo-out-pre]
; Permission, channel limit, caller ID and recording before an outbound call.
; Gosub(envo-out-pre,s,1(tenant,tenantMaxChannels,callerId)) -> ENVO_OUT_OK (1/0)
exten => s,1,Set(ENVO_OUT_OK=0)
 same => n,GotoIf($["${ENVO_OUTBOUND}" = "0"]?denied)
 same => n,Set(CDR(direction)=outbound)
 same => n,Gosub(envo-limit,s,1(envo_tenant,t${ARG1},${ARG2}))
 same => n,GotoIf($[${ENVO_LIMIT_OK} = 0]?full)
 same => n,Set(LOCAL(CID)=${IF($[${LEN(${ENVO_OUTCID})} > 0]?${ENVO_OUTCID}:${ARG3})})
 same => n,ExecIf($[${LEN(${CID})} > 0]?Set(CALLERID(num)=${CID}))
 same => n,GosubIf($["${ENVO_RECOUT}" = "1" | "${ENVO_REC}" = "1"]?envo-record,s,1)
 same => n,Set(ENVO_OUT_OK=1)
 same => n,Return()
 same => n(denied),NoOp(Envo: outbound calling is disabled for this extension)
 same => n,Return()
 same => n(full),NoOp(Envo: SIP server channel limit reached)
 same => n,Return()

[envo-feature]
; Phone feature codes that change per-extension state. Gosub(envo-feature,s,1(tenant,key,value))
exten => s,1,Answer()
 same => n,Wait(0.3)
 same => n,GotoIf($[${LEN(${ENVO_EXT})} = 0]?done)
 same => n,GotoIf($[${LEN(${ARG3})} = 0]?clear)
 same => n,Set(DB(envo/t${ARG1}/${ENVO_EXT}/${ARG2})=${ARG3})
 same => n,Goto(notify)
 same => n(clear),NoOp(${DB_DELETE(envo/t${ARG1}/${ENVO_EXT}/${ARG2})})
 same => n(notify),UserEvent(EnvoFeature,Tenant: ${ARG1},Ext: ${ENVO_EXT},Key: ${ARG2},Value: ${ARG3})
 same => n,Playback(${IF($[${LEN(${ARG3})} = 0 | "${ARG3}" = "0"]?de-activated:activated)})
 same => n(done),Hangup()

[envo-from-trunk]
; Context of every trunk endpoint: all calls arriving from carriers start here.
exten => _[+0-9].,1,Set(ENVO_DID_IN=${EXTEN})
 same => n,Goto(envo-inbound,s,1)
exten => _[a-zA-Z*#].,1,Set(ENVO_DID_IN=${EXTEN})
 same => n,Goto(envo-inbound,s,1)
exten => s,1,Set(ENVO_DID_IN=)
 same => n,Goto(envo-inbound,s,1)

[envo-inbound]
exten => s,1,NoOp(Envo inbound: trunk=${ENVO_TRUNK_ID} request=${ENVO_DID_IN} from=${CALLERID(num)})
 same => n,Set(CDR(direction)=inbound)
 same => n,Gosub(envo-limit,s,1(envo_trunk,trunk${ENVO_TRUNK_ID},${ENVO_TRUNK_MAX}))
 same => n,GotoIf($[${ENVO_LIMIT_OK} = 0]?envo-busy,s,1)
 same => n,GotoIf($[${LEN(${ENVO_DID_IN})} = 0]?to)
 same => n,GotoIf(${DIALPLAN_EXISTS(envo-did,${ENVO_DID_IN},1)}?envo-did,${ENVO_DID_IN},1)
 same => n(to),Set(ENVO_TO=${PJSIP_HEADER(read,To)})
 same => n,Set(ENVO_TO=${CUT(ENVO_TO,@,1)})
 same => n,Set(ENVO_TO=${CUT(ENVO_TO,:,2)})
 same => n,GotoIf($[${LEN(${ENVO_TO})} = 0]?default)
 same => n,GotoIf(${DIALPLAN_EXISTS(envo-did,${ENVO_TO},1)}?envo-did,${ENVO_TO},1)
 same => n(default),GotoIf(${DIALPLAN_EXISTS(envo-trunk-default,trunk${ENVO_TRUNK_ID},1)}?envo-trunk-default,trunk${ENVO_TRUNK_ID},1)
 same => n,NoOp(Envo: no number matched this inbound call)
 same => n,Goto(envo-unavailable,s,1)

[envo-cc]
; Click-to-call from the dashboard: first rings the user's own devices (Local/<ext>@envo-cc).
exten => _X.,1,NoOp(Envo click-to-call for ${EXTEN} to ${ENVO_CC_TARGET})
 same => n,Set(CALLERID(name)=Envo call ${ENVO_CC_TARGET})
 same => n,Set(CALLERID(num)=${ENVO_CC_TARGET})
 same => n,Gosub(envo-ds,s,1(${ENVO_CC_EP1},${ENVO_CC_EP2}))
 same => n,GotoIf($[${LEN(${ENVO_DS})} = 0]?fail)
 same => n,Dial(${ENVO_DS},30)
 same => n(fail),Hangup()

[envo-unavailable]
exten => s,1,Progress()
 same => n,Wait(0.5)
 same => n,Playback(ss-noservice,noanswer)
 same => n,Hangup(1)

[envo-busy]
exten => s,1,Hangup(17)

[envo-blocked]
exten => s,1,NoOp(Envo: rejected blocked caller ${CALLERID(num)})
 same => n,Set(CDR(userfield)=blocked)
 same => n,Hangup(21)

[default]
; Anything that lands in an unknown context is dropped.
exten => _X.,1,Hangup(21)
exten => s,1,Hangup(21)
